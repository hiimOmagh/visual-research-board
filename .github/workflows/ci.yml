name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # npm run test:ci:no-browser executes npm run qa, npm run typecheck, and npm run lint.
      - name: Run consolidated no-browser CI gate
        run: npm run test:ci:no-browser
      - name: Upload full QA gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-qa-gate-report
          path: artifacts/full-qa-gate-report.json
          if-no-files-found: warn
      - name: Build runtime app
        run: npm run build
