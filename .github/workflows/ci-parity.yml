name: CI Parity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify-ci-parity:
    name: verify:ci-parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run clean verification parity
        run: npm run verify:ci-parity
